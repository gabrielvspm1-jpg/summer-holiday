<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A1A1F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Summer Holiday">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Summer Holiday Pontal</title>
<style>
:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:#0A1A1F}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600;700&display=swap">
<style>
/* Layout: app de uma tela. Topo fixo, lista que rola, rodape fixo (abas ou acao principal).
   Escuro de proposito: economiza bateria e le melhor no sol. Cores do cardapio (mar e por do sol). */
:root{
  --bg:#0A1A1F; --surface:#10272E; --surface-2:#173540; --line:#25474F;
  --fg:#F4ECDD; --muted:#9BB3B0;
  --accent:#FF8A3D; --accent-ink:#1C0F05;
  --teal:#35D6C4; --teal-ink:#04211E;
  --amber:#F6C453; --danger:#FF7A6B; --ok:#2ECC71; --ok-ink:#04210F; --bad:#FF4D4D; --bad-ink:#2A0505;
  --f-display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;display:flex;flex-direction:column;overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:30px;font-weight:800}
h2{font-size:18px}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.grow{flex:1;min-width:0}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

#top{flex:none;display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 0;border-bottom:1px solid var(--line)}
#top .who{display:flex;flex-direction:column;min-width:0}
#top .who strong{font-family:var(--f-display);font-size:20px}
.mark{width:46px;height:auto;flex:none;display:block}
#main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:16px 0 24px;-webkit-overflow-scrolling:touch}
#foot{flex:none;padding:10px 0 12px;border-top:1px solid var(--line)}
#foot:empty{display:none}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:4px;background:var(--teal)}
.sync.busy i{background:var(--amber)}
.sync.err{color:var(--danger)}
.sync.err i{background:var(--danger)}

.btn{min-height:52px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.teal{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);background:transparent;border-color:var(--danger)}
.btn.block{display:flex;width:100%}
.btn.big{min-height:60px;font-size:18px}
.btn.sm{min-height:40px;padding:0 12px;border-radius:10px;font-size:14px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn:active{transform:scale(.98)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.sec{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.sec:first-child{margin-top:0}
.sec>h2{display:flex;align-items:center;gap:8px}
.count{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 8px;border-radius:13px;background:var(--surface-2);font:700 13px var(--f-body)}
.empty{padding:18px;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}
.note{padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:14px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.row.ready{border-color:var(--teal)}
.row.tap{width:100%;text-align:left}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;min-height:60%;padding:24px 0}
.center img{width:200px;max-width:70%;height:auto}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mesa{position:relative;min-height:118px;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:4px}
.mesa .ml{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mesa .mn{font:800 34px/1 var(--f-display)}
.mesa .mt{font-weight:700;color:var(--accent)}
.mesa .mi{font-size:13px;color:var(--muted)}
.mesa .gn{font-weight:700;font-size:15px;color:var(--teal)}
.mesa .gn.none{color:var(--amber);font-weight:600;font-size:13px}
.gdot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.sw{width:46px;height:46px;border-radius:23px;border:3px solid transparent}
.sw[aria-pressed=true]{border-color:var(--fg);box-shadow:0 0 0 2px var(--bg) inset}
.gbar{width:100%;display:flex;align-items:center;gap:10px;min-height:50px;padding:0 14px;border-radius:14px;border:1px solid var(--teal);background:var(--surface);margin-bottom:12px;text-align:left}
.gbar strong{flex:1;min-width:0;font-size:17px}
.gbar.none{border-color:var(--amber)}.gbar.none strong{color:var(--amber)}
.gbar .trocar{color:var(--teal);font-weight:700;font-size:14px}.gbar.none .trocar{color:var(--amber)}
.mesa .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.mesa.old{border-color:var(--amber)}

.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:700;border:1px solid;white-space:nowrap}
.c-novo{color:var(--amber);border-color:var(--amber)}
.c-preparo{color:var(--accent);border-color:var(--accent)}
.c-pronto{background:var(--teal);color:var(--teal-ink);border-color:var(--teal)}
.c-entregue{background:var(--ok);color:var(--ok-ink);border-color:var(--ok)}
.c-wait{background:var(--bad);color:#fff;border-color:var(--bad);animation:pulse 1.2s ease-in-out infinite}
.c-gray{color:var(--muted);border-color:var(--line)}
.chip.big{height:30px;font-size:14px;padding:0 14px;border-radius:15px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,77,77,.6)}50%{box-shadow:0 0 0 7px rgba(255,77,77,0)}}
@media (prefers-reduced-motion:reduce){.c-wait,.fila.todo{animation:none}}
.line.ok{border-color:var(--ok);border-left:8px solid var(--ok);background:rgba(46,204,113,.12)}
.line.wait{border-color:var(--bad);border-left:8px solid var(--bad);background:rgba(255,77,77,.14)}
.fila.todo{border:2px solid var(--bad);border-left:10px solid var(--bad);background:rgba(255,77,77,.14);animation:pulse 1.6s ease-in-out infinite}
.fila.todo .it{font-size:24px}
.fila.ready{border:2px solid var(--ok);border-left:10px solid var(--ok);background:rgba(46,204,113,.14)}
.mesa.pend{border:2px solid var(--bad)}
.mesa.allok{border-color:var(--ok)}
.c-bad{color:var(--danger);border-color:var(--danger)}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;border-radius:14px;background:var(--surface);border:1px solid var(--line);margin-bottom:14px}
.seg button{min-height:44px;border-radius:10px;border:0;background:transparent;font-weight:700;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface-2);color:var(--fg);box-shadow:inset 0 -3px 0 var(--accent)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.tab{flex:none;min-height:42px;padding:0 16px;border-radius:21px;border:1px solid var(--line);background:transparent;font-weight:700}
.tab[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:start}
.pickw{position:relative;display:flex;flex-direction:column;gap:6px}
.pickw .pick{flex:1}
.pick{width:100%;height:100%;min-height:100px;padding:12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;gap:6px;text-align:left}
.pick .n{font-weight:700;line-height:1.15}
.pick .d{font-size:12px;color:var(--muted);line-height:1.25}
.pick .p{font:800 17px var(--f-display);color:var(--accent)}
.pick .low{font-size:12px;color:var(--amber);font-weight:700}
.pick:active{transform:scale(.97)}
.pickw.has .pick{border-color:var(--accent)}
.stepq{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:6px;padding:4px;border-radius:16px;background:var(--bg);border:1px solid var(--accent)}
.stepq .q{font:800 22px var(--f-display);text-align:center}
.plus{background:var(--teal)!important;color:var(--teal-ink)!important}
.minus{width:100%;height:48px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font:800 26px/1 var(--f-body);display:grid;place-items:center}
.minus:active{transform:scale(.92)}

.line{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.line .l1{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.line .acts{display:flex;gap:8px;flex-wrap:wrap}
.totalbar{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.totalbar b{font:800 30px var(--f-display)}
.sumrow{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.sumrow:last-child{border-bottom:0}
.toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;text-align:left}
.toggle[aria-pressed=true]{border-color:var(--accent)}
.toggle .sw{flex:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:var(--fg);transition:transform .15s}
.toggle[aria-pressed=true] .sw{background:var(--accent)}
.toggle[aria-pressed=true] .sw::after{transform:translateX(18px);background:var(--accent-ink)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper b{min-width:32px;text-align:center;font:800 22px var(--f-display)}
.pays{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pays .btn[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.fila{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.fila.late{border-color:var(--danger)}
.fila.ready{border-color:var(--teal)}
.fila .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.fila .mn{font:800 28px/1 var(--f-display)}
.fila .it{font-size:20px;font-weight:700;line-height:1.2}

.kpi{padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.kpi .k{font-size:13px;color:var(--muted)}
.kpi .v{font:800 34px/1.1 var(--f-display);margin-top:4px}
.kpi .v.sm{font-size:24px}
.bars{display:flex;flex-direction:column;gap:12px}
.bar .t{display:flex;justify-content:space-between;gap:12px;font-weight:700;margin-bottom:6px}
.bar .tr{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--accent);border-radius:5px}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.alert b{color:var(--amber)}
.ok{color:var(--teal);font-weight:700}

.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.nav button{position:relative;min-height:52px;border:0;background:transparent;font-size:12px;font-weight:700;color:var(--muted);border-radius:12px}
.nav button[aria-current=page]{background:var(--surface-2);color:var(--fg);box-shadow:inset 0 -3px 0 var(--accent)}
.nav .bd{position:absolute;top:4px;left:calc(50% + 8px);min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:800;display:grid;place-items:center}

.estsum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.estsum>div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.estsum b{font:800 30px/1 var(--f-display)}.estsum span{color:var(--muted,#9aa);font-size:13px}
.est2{padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.est2.low{border-color:var(--amber)}.est2.neg{border-color:var(--danger)}
.est2 .eh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:17px}
.est2 .eq{font:800 38px/1 var(--f-display)}
.ebar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.ebar i{display:block;height:100%;background:#3fbf9b;border-radius:6px;transition:width .3s}
.est2.low .ebar i{background:var(--amber)}.est2.neg .ebar i{background:var(--danger)}
.einfo{display:flex;justify-content:space-between;font-size:14px}
.ebtns{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}
.ebtns .btn{min-height:48px;padding:0 6px;font-size:14px}
.stock{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.stock .q{font:800 30px/1 var(--f-display);min-width:56px;text-align:right}
.stock.low{border-color:var(--amber)}
.stock.neg{border-color:var(--danger)}

label.f{display:block;margin-top:12px}
label.f span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input,select,textarea{width:100%;min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:0 14px;font:inherit}
input[type=checkbox]{width:24px;min-height:24px;height:24px;accent-color:var(--accent)}
.check{display:flex;align-items:center;gap:12px;margin-top:14px;min-height:44px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chipbtn{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface-2);font-weight:700}

#modal{position:fixed;inset:0;z-index:50;background:rgba(3,10,12,.74);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:90%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px 20px 0 0;
  padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.sheet h2{font-size:22px;margin-bottom:12px}
.sheet .btns{display:flex;gap:10px;margin-top:16px}
.sheet .btns .btn{flex:1}
.warn{padding:12px 14px;border-radius:12px;border:1px solid var(--amber);color:var(--amber);font-size:14px;margin:0 0 12px}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:22px;font-weight:700;z-index:60;opacity:0;pointer-events:none;transition:opacity .15s}
#toast.on{opacity:1}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:640px){.picks{grid-template-columns:repeat(3,minmax(0,1fr))}.grid2{grid-template-columns:repeat(3,minmax(0,1fr))}#main,#top,#foot{width:100%;max-width:720px;margin-left:auto;margin-right:auto}}

#auth{position:fixed;inset:0;z-index:100;background:var(--bg);overflow:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
#auth .box{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
#auth img.lg{width:180px;max-width:60%;height:auto;align-self:center}
#auth .f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
#auth input{font:inherit;font-size:17px;min-height:52px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);width:100%}
#auth input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
#auth .au-msg{min-height:20px;color:var(--danger);font-size:14px}
#auth .au-msg.good{color:var(--teal)}
#auth .lnk{background:none;border:0;color:var(--teal);text-decoration:underline;min-height:44px;font-weight:600}
</style>

</head>
<body>
<header id="top"></header>
<main id="main"></main>
<footer id="foot"></footer>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" hidden></div>
<div id="auth" hidden>
 <form id="au-form" class="box" autocomplete="on">
  <img class="lg" src="" alt="Summer Holiday Pontal" id="au-logo">
  <h1 id="au-title">Entrar</h1>
  <p class="muted" id="au-sub"></p>
  <label class="f">E-mail<input id="au-email" type="email" inputmode="email" autocomplete="username" autocapitalize="off" autocorrect="off" required></label>
  <label class="f">Senha<input id="au-pass" type="password" autocomplete="current-password" required></label>
  <label class="f" id="au-pass2-w" hidden>Repita a senha<input id="au-pass2" type="password" autocomplete="new-password"></label>
  <div class="au-msg" id="au-msg" role="alert"></div>
  <button type="submit" class="btn primary big block" id="au-go">Entrar</button>
  <button type="button" class="lnk" id="au-toggle"></button>
  <button type="button" class="lnk" id="au-forgot">Esqueci a senha</button>
 </form>
</div>


<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>

var PAGS=['Pix','Cartão','Dinheiro','Transferência'];
var CATS=['Bebidas','Drinks','Petiscos','Almoços'];
var FLUXOS={cozinha:'Cozinha',bar:'Bar',direto:'Direto, pega no cooler'};

var $=function(s){return document.querySelector(s)};
var BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
function money(v){return BRL.format(v||0)}
function round2(x){return Math.round(x*100)/100}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function gid(p){return p+Math.random().toString(36).slice(2,9)}
function now(){return Date.now()}
function clone(o){return JSON.parse(JSON.stringify(o))}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function val(i){var e=document.getElementById(i);return e?e.value:''}
function ago(ts){
  var m=Math.max(0,Math.round((now()-ts)/MIN));
  if(m<1)return 'agora';
  if(m<60)return m+' min';
  var h=Math.floor(m/60),r=m%60;
  return h+'h'+(r?String(r).padStart(2,'0'):'');
}

/* ---------- dados (guardados na conta, iguais em todos os celulares) ---------- */
var DB=null,canWrite=null,AUTH=null,USER=null;
var M={menu:{},estoque:{},mesas:{},dias:{},despesas:{},log:[],garcons:[{id:'g1',nome:'Pedro',regras:{petisco:30,p2:50,p3:0,p4:60,p5:0,p6:80}}]};
var ready={menu:false,mesas:false,estoque:false};
var V={tab:'mesas',mesaId:null,mesaTab:'add',cat:'top',fechando:false,open:{},modal:null,pay:null,fatal:null,slow:false,gtab:'resumo',lastG:''};
var pend={},net={offline:false,fail:false};

/* fila guardada no proprio celular: se a internet cair e a tela recarregar, o que nao subiu ainda e enviado depois */
var QK='shp-fila-v1';
function qget(){try{return JSON.parse(localStorage.getItem(QK)||'{}')||{}}catch(e){return {}}}
function qput(path,data){try{var q=qget();if(data===undefined)delete q[path];else q[path]={d:data};localStorage.setItem(QK,JSON.stringify(q))}catch(e){}}
function syncState(){
  var n=Object.keys(pend).length;
  if(V.fatal)return['err','Sem conexão'];
  if(net.offline||net.fail)return['err','Sem internet'+(n?' · '+n+' a enviar':' · salvo')];
  if(n)return['busy','Salvando…'];
  return['ok','Salvo'];
}
function syncHTML(){var s=syncState();return '<span id="sync" class="sync '+s[0]+'"><i></i>'+s[1]+'</span>'}
function setSync(){var el=document.getElementById('sync');if(el)el.outerHTML=syncHTML()}

/* grava um documento; junta toques seguidos em uma gravacao e tenta de novo se a internet cair */
function saveDoc(path,getData){
  if(!DB)return;
  var p=pend[path];
  if(p){p.dirty=true;p.get=getData;return}
  p=pend[path]={dirty:true,get:getData};
  setSync();
  (async function loop(){
    var tries=0;
    while(p.dirty){
      p.dirty=false;
      try{
        var data=p.get();
        qput(path,data);
        if(data===null)await DB.doc(path).delete();else await DB.doc(path).set(data);
        tries=0;net.fail=false;
      }catch(e){
        p.dirty=true;tries++;net.fail=true;setSync();
        await sleep(Math.min(1500*tries,10000));
      }
    }
    delete pend[path];qput(path,undefined);setSync();
  })();
}
async function writeNow(path,data){
  for(var i=0;i<4;i++){
    try{if(data===null)await DB.doc(path).delete();else await DB.doc(path).set(data);return true}
    catch(e){await sleep(1200*(i+1))}
  }
  return false;
}
function mergeColl(name,snap){
  var o={};
  snap.docs.forEach(function(d){var x=clone(d.data());x.id=d.id;o[d.id]=x});
  Object.keys(pend).forEach(function(p){
    var a=p.split('/');
    if(a[0]===name){if(M[name][a[1]])o[a[1]]=M[name][a[1]];else delete o[a[1]]}
  });
  M[name]=o;
}
function listen(name,query,fn){
  query.onSnapshot(function(snap){fn(snap);if(name in ready)ready[name]=true;rq()},function(e){
    V.fatal=(e&&e.code==='revoked')?'revoked':'erro';rq();
  });
}
function saveMesa(m){saveDoc('mesas/'+m.id,function(){return M.mesas[m.id]?clone(M.mesas[m.id]):null})}
function saveEstoqueDoc(id){saveDoc('estoque/'+id,function(){return M.estoque[id]?clone(M.estoque[id]):null})}
function saveMenuDoc(id){saveDoc('menu/'+id,function(){return M.menu[id]?clone(M.menu[id]):null})}
function saveGarcons(){saveDoc('config/garcons',function(){return{list:clone(M.garcons)}})}
function saveLog(){saveDoc('log/cancel',function(){return{list:M.log}})}

/* ---------- regras ---------- */
function menuList(){return Object.keys(M.menu).map(function(k){return M.menu[k]}).sort(function(a,b){return(a.ord||0)-(b.ord||0)})}
function item(i){return M.menu[i]}
function mesaPor(i){return M.mesas[i]}
function sub(m){return round2(m.itens.reduce(function(a,l){return a+l.preco*l.qtd},0))}
function calc(m){var s=sub(m),t=m.mais10?round2(s*0.1):0;return{sub:s,taxa:t,total:round2(s+t)}}
function abertas(){return Object.keys(M.mesas).map(function(k){return M.mesas[k]}).filter(function(m){return m.status==='aberta'}).sort(function(a,b){return a.nome.localeCompare(b.nome,'pt-BR',{numeric:true})})}
function fechadas(){return Object.keys(M.mesas).map(function(k){return M.mesas[k]}).filter(function(m){return m.status==='fechada'})}
function lineOf(m,u){return m&&m.itens.filter(function(l){return l.uid===u})[0]}
/* restam = contagem base - o que foi lancado desde a contagem. Nada de contador: calculado a cada vez. */
function restam(itemId){
  var e=M.estoque[itemId],base=e?(e.base||0):0,bt=e?(e.baseTs||0):0,sold=0;
  Object.keys(M.mesas).forEach(function(k){
    var m=M.mesas[k];
    m.itens.forEach(function(l){if(l.itemId===itemId&&l.ts>=bt)sold+=l.qtd});
    (m.baixas||[]).forEach(function(b){if(b.itemId===itemId&&b.ts>=bt)sold+=b.qtd});
  });
  return base-sold;
}
function vendasDe(id){
  var n=0;Object.keys(M.mesas).forEach(function(k){M.mesas[k].itens.forEach(function(l){if(l.itemId===id)n+=l.qtd})});
  return n;
}
function logCancel(mesa,nome,valor,motivo){
  M.log.unshift({ts:now(),mesa:mesa,item:nome,valor:valor,motivo:motivo});
  M.log=M.log.slice(0,100);saveLog();
}
function addItem(itemId){
  var m=mesaPor(V.mesaId);if(!m||m.status!=='aberta')return;
  var it=item(itemId);if(!it)return;
  var st=it.fluxo==='direto'?'entregue':'novo';
  var l=m.itens.filter(function(x){return x.itemId===itemId&&x.status===st})[0];
  if(l){l.qtd+=1}else{m.itens.push({uid:gid('l'),itemId:itemId,nome:it.nome,preco:it.preco,qtd:1,status:st,fluxo:it.fluxo,ts:now(),tsStatus:now()})}
  saveMesa(m);toast('+1 '+it.nome);
}
function menos(itemId){
  var m=mesaPor(V.mesaId);if(!m)return;
  var ls=m.itens.filter(function(x){return x.itemId===itemId});if(!ls.length)return;
  var l=ls.filter(function(x){return x.status==='novo'}).pop()||ls[ls.length-1];
  l.qtd-=1;
  if(l.qtd<=0)m.itens=m.itens.filter(function(x){return x!==l});
  saveMesa(m);
  logCancel(m.nome,l.nome,l.preco,'Tirado na hora');
  toast('−1 '+l.nome);
}
function tirar(mesaId,luid,motivo){
  var m=mesaPor(mesaId),l=lineOf(m,luid);if(!l)return;
  l.qtd-=1;
  if(motivo==='perda'){m.baixas=m.baixas||[];m.baixas.push({itemId:l.itemId,qtd:1,ts:now()})}
  if(l.qtd<=0)m.itens=m.itens.filter(function(x){return x!==l});
  var rot=MOTIVOS.filter(function(x){return x[0]===motivo})[0];
  saveMesa(m);
  logCancel(m.nome,l.nome,l.preco,rot?rot[1]:motivo);
  toast('Tirei 1 '+l.nome);
}
function avancar(mesaId,luid){
  var m=mesaPor(mesaId),l=lineOf(m,luid);if(!l)return;
  var next={novo:l.fluxo==='bar'?'pronto':'preparo',preparo:'pronto',pronto:'entregue'}[l.status];
  if(!next)return;
  l.status=next;l.tsStatus=now();saveMesa(m);
}
function passar(fromId,luid,toId){
  var a=mesaPor(fromId),b=mesaPor(toId),l=lineOf(a,luid);if(!a||!b||!l)return;
  a.itens=a.itens.filter(function(x){return x!==l});
  var ex=b.itens.filter(function(x){return x.itemId===l.itemId&&x.status===l.status&&x.preco===l.preco})[0];
  if(ex)ex.qtd+=l.qtd;else b.itens.push(l);
  saveMesa(a);saveMesa(b);toast('Passei para a Mesa '+b.nome);
}
function fecharMesa(){
  var m=mesaPor(V.mesaId);if(!m||!V.pay)return;
  var c=calc(m);
  m.status='fechada';m.pagamento=V.pay;m.total=c.total;m.fechadaTs=now();
  var gg=garcom(m.garcomId);if(gg){var cm=calcComissao(m,gg);m.comissao={garcomId:gg.id,nome:gg.nome,total:cm.total,taxa:c.taxa,linhas:cm.linhas.map(function(l){return{k:l.k,qtd:l.qtd,valor:l.valor,total:l.total}})}}
  V.mesaId=null;V.fechando=false;V.pay=null;
  saveMesa(m);toast('Mesa '+m.nome+' fechada · '+money(c.total));
}
/* ---------- comissao dos garcons ---------- */
var REGRAS=[['petisco','Petisco'],['caipe','Caipirinha (e caipvodka)'],['p2','Almoço p/ 2'],['p3','Almoço p/ 3'],['p4','Almoço p/ 4'],['p5','Almoço p/ 5'],['p6','Almoço p/ 6']];
function rotulo(k){var r=REGRAS.filter(function(x){return x[0]===k})[0];return r?r[1]:k}
function garcom(id){return M.garcons.filter(function(g){return g.id===id})[0]}
var GCORES=['#FF8A3D','#35D6C4','#F6C453','#B38CFF','#FF6FB5','#5AA9FF','#E9DCC3'];
function gCor(id){
  var i=-1;M.garcons.forEach(function(g,k){if(g.id===id)i=k});
  if(i<0)return 'var(--muted)';
  return M.garcons[i].cor||GCORES[i%GCORES.length];
}
function gDot(id){return '<span class="gdot" style="background:'+gCor(id)+'"></span>'}
function gNome(m){var g=garcom(m.garcomId);return g?g.nome:(m.garcomNome||'')}
function regraDe(l){
  var it=item(l.itemId),cat=it?it.cat:(/P\/\d/i.test(l.nome)?'Almoços':'');
  if(cat==='Petiscos')return 'petisco';
  if(/^caip/i.test(l.nome))return 'caipe';
  if(cat==='Almoços'){var x=/P\/(\d)/i.exec(l.nome);if(x)return 'p'+x[1]}
  return null;
}
function calcComissao(m,g){
  var por={},total=0;
  m.itens.forEach(function(l){
    var k=regraDe(l);if(!k)return;
    var v=(g.regras&&g.regras[k])||0;if(!v)return;
    var x=por[k]||(por[k]={k:k,qtd:0,valor:v,total:0});
    x.qtd+=l.qtd;x.total=round2(x.total+v*l.qtd);total=round2(total+v*l.qtd);
  });
  return{total:total,linhas:REGRAS.map(function(r){return por[r[0]]}).filter(Boolean)};
}
function comissaoDia(){
  var map={},order=[],ab=0;
  function novo(id,nome){return{id:id,nome:nome,com:0,taxa:0,nMesas:0,total:0,por:{}}}
  M.garcons.forEach(function(g){map[g.id]=novo(g.id,g.nome);order.push(g.id)});
  fechadas().forEach(function(m){
    var c=m.comissao;if(!c)return;
    var e=map[c.garcomId];
    if(!e){e=map[c.garcomId]=novo(c.garcomId,c.nome);order.push(c.garcomId)}
    e.com=round2(e.com+c.total);e.taxa=round2(e.taxa+(c.taxa||0));e.nMesas+=1;
    c.linhas.forEach(function(l){var p=e.por[l.k]||(e.por[l.k]={k:l.k,qtd:0,total:0});p.qtd+=l.qtd;p.total=round2(p.total+l.total)});
  });
  abertas().forEach(function(m){var g=garcom(m.garcomId);if(g)ab=round2(ab+calcComissao(m,g).total+calc(m).taxa)});
  var list=order.map(function(id){var e=map[id];e.total=round2(e.com+e.taxa);e.linhas=REGRAS.map(function(r){return e.por[r[0]]}).filter(Boolean);return e});
  return{list:list,total:round2(list.reduce(function(a,e){return a+e.total},0)),aberto:ab};
}
function saveGarcom(){
  var nome=val('g-nome').trim();
  if(!nome){toast('Digite o nome');return false}
  var regras={};
  REGRAS.forEach(function(r){var v=parseFloat(val('g-r-'+r[0]).replace(',','.'));regras[r[0]]=(isNaN(v)||v<0)?0:round2(v)});
  var g=V.modal.id==='new'?null:garcom(V.modal.id);
  var cor=V.modal.cor||(g&&g.cor)||(g?gCor(g.id):GCORES[M.garcons.length%GCORES.length]);
  if(g){g.nome=nome;g.regras=regras;g.cor=cor}else M.garcons.push({id:gid('g'),nome:nome,regras:regras,cor:cor});
  saveGarcons();toast('Garçom salvo');return true;
}
/* ---------- despesas do dia ---------- */
function saveDesp(id){saveDoc('despesas/'+id,function(){return M.despesas[id]?clone(M.despesas[id]):null})}
function despesasDia(){
  var l=Object.keys(M.despesas).map(function(k){return M.despesas[k]}).sort(function(a,b){return a.ts-b.ts});
  var di=round2(l.filter(function(d){return d.tipo==='diaria'}).reduce(function(a,d){return a+(d.valor||0)},0)),tot=round2(l.reduce(function(a,d){return a+(d.valor||0)},0));
  return{list:l,total:tot,diarias:di,gastos:round2(tot-di)};
}
function saveDespForm(){
  var tipo=V.modal.tipo==='diaria'?'diaria':'gasto',nome=val('f-desc').trim(),v=parseFloat(val('f-valor').replace(',','.'));
  if(isNaN(v)||v<=0){toast('Digite o valor');return false}
  var desc=tipo==='diaria'?('Diária'+(nome?' '+nome:'')):(nome||'Compras');
  var id=gid('x');M.despesas[id]={id:id,ts:now(),desc:desc,valor:round2(v),tipo:tipo};
  saveDesp(id);toast(desc+' · '+money(v));return true;
}
function resultadoHTML(r,titulo){
  var liq=r.liquido,neg=liq<0;
  return '<div class="card"><h2 style="margin-bottom:6px">'+titulo+'</h2>'+
    '<div class="sumrow"><span>Bruto (vendido)</span><b class="num">'+money(r.total)+'</b></div>'+
    '<div class="sumrow"><span>− Garçons (comissão + 10%)</span><b class="num">'+money(r.garcons.total)+'</b></div>'+
    '<div class="sumrow"><span>− Compras e gastos</span><b class="num">'+money(r.desp.gastos)+'</b></div><div class="sumrow"><span>− Diárias</span><b class="num">'+money(r.desp.diarias)+'</b></div>'+
    '<div class="totalbar" style="margin-top:8px"><span class="muted">Líquido</span><b class="num" style="font-size:30px;color:'+(neg?'var(--danger)':'var(--ok)')+'">'+money(liq)+'</b></div></div>';
}
function resumoDia(){
  var f=fechadas(),porForma={},top={},total=0,taxa=0;
  f.forEach(function(m){
    var c=calc(m);total+=m.total;taxa+=m.total-c.sub;
    porForma[m.pagamento]=(porForma[m.pagamento]||0)+m.total;
    m.itens.forEach(function(l){top[l.nome]=(top[l.nome]||0)+l.qtd});
  });
  var o={total:round2(total),taxa:round2(taxa),nMesas:f.length,porForma:porForma,
    top:Object.keys(top).map(function(k){return{nome:k,qtd:top[k]}}).sort(function(a,b){return b.qtd-a.qtd}).slice(0,5),
    abertas:abertas(),garcons:comissaoDia(),desp:despesasDia()};
  o.liquido=round2(o.total-o.garcons.total-o.desp.total);
  return o;
}
async function fecharDia(){
  var r=resumoDia(),dia=gid('d'),its=menuList().filter(function(x){return x.estoque});
  var snap=its.map(function(x){return{id:x.id,nome:x.nome,qtd:restam(x.id)}});
  var f=fechadas();
  V.modal=null;toast('Fechando o dia…');
  var ok=await writeNow('dias/'+dia,{ts:now(),total:r.total,taxa:r.taxa,nMesas:r.nMesas,porForma:r.porForma,top:r.top,
    estoque:snap.map(function(s){return{nome:s.nome,qtd:s.qtd}}),abertas:r.abertas.map(function(m){return m.nome}),
    garcons:r.garcons.list.filter(function(g){return g.total>0}).map(function(g){return{nome:g.nome,total:g.total,com:g.com,taxa:g.taxa,linhas:g.linhas.map(function(l){return{k:l.k,qtd:l.qtd,total:l.total}})}}),
    garconsTotal:r.garcons.total,despesas:r.desp.list.map(function(d){return{desc:d.desc,valor:d.valor,tipo:d.tipo||'gasto'}}),despesasTotal:r.desp.total,diariasTotal:r.desp.diarias,liquido:r.liquido});
  if(!ok){toast('Não consegui fechar o dia. Tente de novo.');return}
  for(var i=0;i<snap.length;i++){
    var e=M.estoque[snap[i].id]||{};
    await writeNow('estoque/'+snap[i].id,{base:snap[i].qtd,baseTs:now(),contagem:e.contagem||null});
  }
  for(var j=0;j<f.length;j++)await writeNow('mesas/'+f[j].id,null);
  for(var k=0;k<r.desp.list.length;k++){await writeNow('despesas/'+r.desp.list[k].id,null)}
  toast('Dia fechado · líquido '+money(r.liquido));
}
async function limparTeste(){
  V.modal=null;toast('Limpando…');
  var ms=Object.keys(M.mesas),ds=Object.keys(M.dias);
  for(var i=0;i<ms.length;i++)await writeNow('mesas/'+ms[i],null);
  for(var j=0;j<ds.length;j++)await writeNow('dias/'+ds[j],null);
  await writeNow('log/cancel',{list:[]});
  toast('Dados de teste limpos');
}
function alertas(){
  var a=[];
  menuList().forEach(function(it){
    if(!it.estoque)return;
    var q=restam(it.id);
    if(q<=(it.min||0))a.push('<b>Estoque:</b> '+esc(it.nome)+', restam '+q);
  });
  abertas().forEach(function(m){
    m.itens.forEach(function(l){
      var fila=(now()-l.ts)/MIN,parado=(now()-l.tsStatus)/MIN;
      if(l.fluxo==='cozinha'&&(l.status==='novo'||l.status==='preparo')&&fila>25)a.push('<b>Cozinha:</b> Mesa '+esc(m.nome)+', '+l.qtd+'× '+esc(l.nome)+' espera há '+ago(l.ts));
      else if(l.fluxo==='bar'&&l.status==='novo'&&fila>10)a.push('<b>Bar:</b> Mesa '+esc(m.nome)+', '+l.qtd+'× '+esc(l.nome)+' espera há '+ago(l.ts));
      else if(l.status==='pronto'&&parado>5)a.push('<b>Entrega:</b> Mesa '+esc(m.nome)+', '+esc(l.nome)+' pronto há '+ago(l.tsStatus)+' e não levado');
    });
    if((now()-m.abertaTs)/MIN>90)a.push('<b>Mesa aberta:</b> Mesa '+esc(m.nome)+' há '+ago(m.abertaTs));
  });
  return a.slice(0,10);
}
function filaItens(){
  var pr=[],q=[];
  abertas().forEach(function(m){m.itens.forEach(function(l){
    if(l.fluxo==='direto')return;
    if(l.status==='pronto')pr.push({m:m,l:l});else if(l.status==='novo'||l.status==='preparo')q.push({m:m,l:l});
  })});
  pr.sort(function(a,b){return a.l.tsStatus-b.l.tsStatus});
  q.sort(function(a,b){return a.l.ts-b.l.ts});
  return{pr:pr,q:q};
}

/* ---------- telas ---------- */
function lineChip(l){return l.status==='entregue'?'<span class="chip big c-entregue">✓ ENTREGUE</span>':'<span class="chip big c-wait">'+(l.status==='pronto'?'PRONTO · LEVAR':l.status==='preparo'?'NO FOGO · NÃO ENTREGUE':'NÃO ENTREGUE')+'</span>'}
function chip(st){return '<span class="chip c-'+st+'">'+ST[st]+'</span>'}
function topTab(titulo,subtitulo){
  return '<img class="mark" src="'+LOGO+'" alt="">'+'<div class="who"><strong>'+esc(titulo)+'</strong>'+(subtitulo?'<span class="muted small">'+subtitulo+'</span>':'')+'</div><span class="grow"></span>'+syncHTML();
}
function navHTML(){
  var f=filaItens(),nf=f.pr.length+f.q.length;
  var tabs=[['mesas','Mesas'],['fila','Fila'],['estoque','Estoque'],['cardapio','Cardápio'],['hoje','Gestão']];
  return '<nav class="nav" aria-label="Seções">'+tabs.map(function(t){
    return '<button data-a="tab" data-v="'+t[0]+'"'+(V.tab===t[0]?' aria-current="page"':'')+'>'+t[1]+(t[0]==='fila'&&nf?'<span class="bd">'+nf+'</span>':'')+'</button>';
  }).join('')+'</nav>';
}
function sFatal(){
  var msg={nodb:'Não consegui abrir os dados.',sdk:'Não consegui carregar o app. Abra uma vez com internet e tente de novo.',config:'Falta colar a configuração do Firebase no arquivo config.js.',revoked:'O acesso foi retirado.',erro:'Sem permissão ou sem conexão com os dados. Confira se entrou com o e-mail do dono.'}[V.fatal]||'Algo deu errado.';
  return{top:'',main:'<div class="center"><img src="'+LOGO+'" alt="Summer Holiday Pontal"><h1>Ops</h1><p class="muted">'+msg+'</p><button class="btn primary big" data-a="reload">Tentar de novo</button></div>',foot:''};
}
function sLoading(){
  return{top:'',main:'<div class="center"><img src="'+LOGO+'" alt="Summer Holiday Pontal"><p class="muted">'+(V.slow?'Demorando mais que o normal. Confira a internet.':'Abrindo…')+'</p></div>',foot:''};
}
function sMesas(){
  var ab=abertas(),pr=[];
  ab.forEach(function(m){m.itens.forEach(function(l){if(l.status==='pronto')pr.push({m:m,l:l})})});
  var h='<button class="btn primary block big" data-a="nova-mesa">+ Nova mesa</button>';
  if(pr.length){
    h+='<section class="sec"><h2>Pronto pra levar <span class="count">'+pr.length+'</span></h2>'+pr.map(function(x){
      return '<div class="row ready"><div class="grow"><strong>Mesa '+esc(x.m.nome)+'</strong><div>'+x.l.qtd+'× '+esc(x.l.nome)+'</div><small class="muted">pronto há '+ago(x.l.tsStatus)+'</small></div><button class="btn teal" data-a="entregar" data-m="'+x.m.id+'" data-l="'+x.l.uid+'">Entregue</button></div>';
    }).join('')+'</section>';
  }
  h+='<section class="sec"><h2>Mesas abertas <span class="count">'+ab.length+'</span></h2>';
  if(!ab.length)h+='<p class="empty">Nenhuma mesa aberta. Toque em Nova mesa quando o cliente chegar.</p>';
  else h+='<div class="grid2">'+ab.map(function(m){
    var np=m.itens.filter(function(l){return l.status==='pronto'}).length;
    var nf=m.itens.filter(function(l){return l.status==='novo'||l.status==='preparo'}).length;
    var old=(now()-m.abertaTs)/MIN>90;
    var pend=np+nf,nent=m.itens.filter(function(l){return l.status==='entregue'}).length;
    var chips=(pend?'<span class="chip c-wait">'+pend+' não entregue'+(pend>1?'s':'')+'</span>':'')+(nent&&!pend?'<span class="chip c-entregue">✓ tudo entregue</span>':'')+(old?'<span class="chip c-novo">aberta há '+ago(m.abertaTs)+'</span>':'');
    return '<button class="mesa'+(old?' old':'')+(pend?' pend':nent?' allok':'')+'" style="border-left:8px solid '+(gNome(m)?gCor(m.garcomId):'var(--line)')+'" data-a="abrir-mesa" data-m="'+m.id+'"><span class="ml">Mesa</span><span class="mn">'+esc(m.nome)+'</span>'+(gNome(m)?'<span class="gn" style="color:'+gCor(m.garcomId)+'">'+esc(gNome(m))+'</span>':'<span class="gn none">sem garçom</span>')+'<span class="mt num">'+money(sub(m))+'</span><span class="mi">aberta há '+ago(m.abertaTs)+'</span>'+(chips?'<span class="chips">'+chips+'</span>':'')+'</button>';
  }).join('')+'</div>';
  h+='</section>';
  return{top:topTab('Mesas',''),main:h,foot:navHTML()};
}
function topItens(){
  return menuList().filter(function(x){return x.ativo!==false}).map(function(x){return{it:x,n:vendasDe(x.id)+(x.pop||0)}}).sort(function(a,b){return b.n-a.n}).slice(0,10).map(function(x){return x.it});
}
function sMesa(){
  var m=mesaPor(V.mesaId);
  var qtdMesa={};m.itens.forEach(function(l){qtdMesa[l.itemId]=(qtdMesa[l.itemId]||0)+l.qtd});
  var nitens=m.itens.reduce(function(a,l){return a+l.qtd},0);

  if(V.mesaTab==='add'){

var shown=null;

  el.hidden=false;el.innerHTML=modalHTML();
  if(V.modal.type==='novamesa'||V.modal.type==='estoque'||V.modal.type==='item'||V.modal.type==='desp'){

var lastKey='',rqT=null;
function rq(){if(rqT)return;rqT=setTimeout(function(){rqT=null;render()},0)}
function render(){
  var r;
  if(V.fatal)r=sFatal();
  else if(!(ready.menu&&ready.mesas&&ready.estoque))r=sLoading();
  else{
    if(V.mesaId){var mm=mesaPor(V.mesaId);if(!mm||mm.status!=='aberta'){V.mesaId=null;V.fechando=false}}
    r=V.mesaId?(V.fechando?sFechar():sMesa()):({mesas:sMesas,fila:sFila,estoque:sEstoque,cardapio:sCardapio,hoje:sHoje}[V.tab])();
    if(canWrite===false)r.main='<p class="warn">Você só pode ver. Para lançar pedidos, peça ao dono acesso de editor.</p>'+r.main;
  }
  var key=[V.fatal,V.tab,V.gtab,V.mesaId,V.mesaTab,V.fechando,ready.menu&&ready.mesas&&ready.estoque].join('|');
  $('#top').innerHTML=r.top;
  $('#main').innerHTML=r.main;
  $('#foot').innerHTML=r.foot;
  $('#top').style.display=r.top?'':'none';
  if(key!==lastKey){$('#main').scrollTop=0;lastKey=key}
  renderModal();
}
var tt=null;

  var t=$('#toast');t.textContent=msg;t.classList.add('on');

}

function saveItem(){
  var nome=val('f-nome').trim(),preco=parseFloat(val('f-preco').replace(',','.'));
  if(!nome||isNaN(preco)||preco<0){toast('Preencha nome e preço');return false}
  var novo=V.modal.id==='new',it=novo?null:item(V.modal.id);
  var data={nome:nome,desc:val('f-desc').trim(),preco:round2(preco),cat:val('f-cat'),fluxo:val('f-fluxo'),ativo:document.getElementById('f-ativo').checked,estoque:document.getElementById('f-estoque').checked,min:parseInt(val('f-min'),10)||0};
  if(it)Object.assign(it,data);
  else{
    var ord=menuList().reduce(function(a,x){return Math.max(a,x.ord||0)},0)+1;
    it=Object.assign({id:gid('i'),ord:ord},data);M.menu[it.id]=it;
  }
  saveMenuDoc(it.id);
  if(it.estoque&&!M.estoque[it.id]){M.estoque[it.id]={id:it.id,base:0,baseTs:now(),contagem:null};saveEstoqueDoc(it.id)}
  toast('Item salvo');return true;
}
function saveEstoque(){
  var it=item(V.modal.id),n=parseInt(val('f-qtd'),10);
  if(isNaN(n)||n<0){toast('Digite um número');return false}
  var e=M.estoque[it.id]||{id:it.id,base:0,baseTs:0,contagem:null};
  if(V.modal.tipo==='entrada'){e.base=(e.base||0)+n;toast('+'+n+' '+it.nome)}
  else{
    var esp=restam(it.id),dif=n-esp;
    e.base=n;e.baseTs=now();e.contagem={ts:now(),dif:dif,esperado:esp,contado:n};
    toast(dif===0?'Contagem bateu':(dif>0?'Sobraram ':'Faltaram ')+Math.abs(dif));
  }
  M.estoque[it.id]=e;saveEstoqueDoc(it.id);return true;
}
document.addEventListener('click',function(e){
  if(e.target.id==='modal'){V.modal=null;render();return}
  var el=e.target.closest('[data-a]');if(!el||el.disabled)return;
  var a=el.dataset.a,d=el.dataset,m;
  switch(a){
    case 'reload':location.reload();return;
    case 'logout':if(AUTH)AUTH.signOut().then(function(){location.reload()},function(){location.reload()});return;
    case 'tab':V.tab=d.v;break;
    case 'nova-mesa':V.modal={type:'novamesa',g:V.lastG||''};break;
    case 'nm-g':V.modal={type:'novamesa',nome:val('f-mesa'),g:d.v};break;

    case 'gmesa':V.modal={type:'gmesa'};break;
    case 'gmesa-ok':m=mesaPor(V.mesaId);var gsel=garcom(d.v);m.garcomId=gsel?gsel.id:'';m.garcomNome=gsel?gsel.nome:'';V.lastG=m.garcomId;saveMesa(m);V.modal=null;break;
    case 'criar-mesa':
      var nome=val('f-mesa').trim();
      if(!nome){toast('Digite o número da mesa');return}
      if(abertas().some(function(x){return x.nome.toLowerCase()===nome.toLowerCase()})){toast('A mesa '+nome+' já está aberta');return}
      var gsel2=garcom(V.modal.g||'');V.lastG=gsel2?gsel2.id:'';
      var nm={id:gid('m'),nome:nome,abertaTs:now(),status:'aberta',mais10:true,divide:1,itens:[],baixas:[],garcomId:gsel2?gsel2.id:'',garcomNome:gsel2?gsel2.nome:''};
      M.mesas[nm.id]=nm;saveMesa(nm);V.mesaId=nm.id;V.mesaTab='add';V.modal=null;break;
    case 'abrir-mesa':V.mesaId=d.m;V.mesaTab='add';V.fechando=false;break;
    case 'voltar':V.mesaId=null;V.fechando=false;V.pay=null;break;
    case 'mesa-tab':V.mesaTab=d.v;break;
    case 'cat':V.cat=d.v;break;
    case 'add':addItem(d.i);break;
    case 'menos':menos(d.i);break;
    case 'entregar':case 'avancar':avancar(d.m,d.l);break;
    case 'tirar':V.modal={type:'motivo',m:d.m,l:d.l};break;
    case 'motivo-ok':tirar(V.modal.m,V.modal.l,d.v);V.modal=null;break;
    case 'passar':V.modal={type:'passar',m:d.m,l:d.l};break;
    case 'passar-ok':passar(V.modal.m,V.modal.l,d.to);V.modal=null;break;
    case 'fechar-conta':V.fechando=true;V.pay=null;break;
    case 'fechar-voltar':V.fechando=false;break;
    case 'toggle10':m=mesaPor(V.mesaId);m.mais10=!m.mais10;saveMesa(m);break;
    case 'div':m=mesaPor(V.mesaId);m.divide=Math.max(1,(m.divide||1)+parseInt(d.v,10));saveMesa(m);break;
    case 'pag':V.pay=d.v;break;
    case 'fechar-ok':fecharMesa();break;
    case 'expand':V.open[d.k]=!V.open[d.k];break;
    case 'est':V.modal={type:'estoque',id:d.i,tipo:d.t};break;
    case 'est-quick':var qi=item(d.i),qe=M.estoque[d.i]||{id:d.i,base:0,baseTs:0,contagem:null};qe.base=(qe.base||0)+parseInt(d.v,10);M.estoque[d.i]=qe;saveEstoqueDoc(d.i);toast('+'+d.v+' '+qi.nome);break;
    case 'qtd-add':var inp=document.getElementById('f-qtd');if(inp)inp.value=(parseInt(inp.value,10)||0)+parseInt(d.v,10);return;
    case 'est-ok':if(saveEstoque())V.modal=null;else return;break;
    case 'item':V.modal={type:'item',id:d.i};break;
    case 'item-ok':if(saveItem())V.modal=null;else return;break;
    case 'fd':V.modal={type:'fechardia'};break;
    case 'fd-ok':fecharDia().then(rq);break;
    case 'conf':V.modal={type:'confirm'};break;

function seedMenu(){
  var b=DB.batch(),t=Date.now();
  SEED.forEach(function(x){
    var d=clone(x),id=d.id;delete d.id;
    b.set(DB.collection('menu').doc(id),d);
    if(d.estoque)b.set(DB.collection('estoque').doc(id),{base:0,baseTs:t,contagem:null});
  });
  b.set(DB.doc('log/cancel'),{list:[]});
  return b.commit().catch(function(){seeded=false});
}
function startApp(){
  listen('menu',DB.collection('menu'),function(s){
    if(!seeded&&s.empty&&s.metadata&&!s.metadata.fromCache){seeded=true;seedMenu()}
    mergeColl('menu',s);
  });
  listen('mesas',DB.collection('mesas'),function(s){mergeColl('mesas',s)});
  listen('estoque',DB.collection('estoque'),function(s){mergeColl('estoque',s)});
  listen('dias',DB.collection('dias').orderBy('ts','desc').limit(60),function(s){mergeColl('dias',s)});
  listen('despesas',DB.collection('despesas'),function(s){mergeColl('despesas',s)});
  DB.doc('config/garcons').onSnapshot(function(s){
    if(pend['config/garcons'])return;
    var d=s.exists?s.data():null;
    if(d&&d.list)M.garcons=clone(d.list);
    rq();
  },function(){});
  DB.doc('log/cancel').onSnapshot(function(s){
    if(pend['log/cancel'])return;
    var d=s.exists?s.data():null;M.log=(d&&d.list)?clone(d.list):[];rq();
  },function(){});
}
function wireAuth(){
  var $=function(i){return document.getElementById(i)},mode='in',busy=false,started=false;
  function msg(t,good){var m=$('au-msg');m.textContent=t||'';m.className='au-msg'+(good?' good':'')}
  function setMode(m){
    mode=m;msg('');
    $('au-pass2-w').hidden=(m==='in');
    $('au-go').textContent=m==='in'?'Entrar':'Criar minha conta';
    $('au-title').textContent=m==='in'?'Entrar':'Primeiro acesso';
    $('au-sub').textContent=m==='in'?'Use o e-mail e a senha do dono. O mesmo serve nos dois celulares.':'Crie o e-mail e a senha do dono. Faça isso uma vez só; depois é só entrar.';
    $('au-toggle').textContent=m==='in'?'Primeiro acesso? Criar conta':'Já tenho conta. Entrar';
    $('au-pass').setAttribute('autocomplete',m==='in'?'current-password':'new-password');
  }
  var ERR={'auth/invalid-credential':'E-mail ou senha incorretos.','auth/wrong-password':'E-mail ou senha incorretos.','auth/user-not-found':'E-mail ou senha incorretos.','auth/invalid-email':'Esse e-mail não parece certo.','auth/email-already-in-use':'Esse e-mail já tem conta. Toque em "Já tenho conta".','auth/weak-password':'Senha curta demais. Use pelo menos 6 caracteres.','auth/network-request-failed':'Sem internet. O primeiro login precisa de internet.','auth/too-many-requests':'Muitas tentativas. Espere um pouco e tente de novo.','auth/operation-not-allowed':'Login por e-mail não está ligado no Firebase.'};
  async function go(){
    if(busy)return;
    var em=$('au-email').value.trim(),pw=$('au-pass').value;
    if(!em||!pw){msg('Digite o e-mail e a senha.');return}
    if(mode==='up'){
      if(pw.length<6){msg('Use pelo menos 6 caracteres na senha.');return}
      if(pw!==$('au-pass2').value){msg('As duas senhas não são iguais.');return}
    }
    busy=true;$('au-go').disabled=true;msg('');
    try{
      if(mode==='in')await AUTH.signInWithEmailAndPassword(em,pw);
      else await AUTH.createUserWithEmailAndPassword(em,pw);
    }catch(e){msg(ERR[e&&e.code]||('Não deu certo ('+((e&&e.code)||'erro')+').'))}
    busy=false;$('au-go').disabled=false;
  }
  $('au-go').addEventListener('click',go);
  $('au-form').addEventListener('submit',function(e){e.preventDefault();go()});
  $('au-toggle').addEventListener('click',function(){setMode(mode==='in'?'up':'in')});
  $('au-forgot').addEventListener('click',async function(){
    var em=$('au-email').value.trim();
    if(!em){msg('Digite seu e-mail acima e toque de novo.');return}
    try{await AUTH.sendPasswordResetEmail(em);msg('Mandei um e-mail para trocar a senha. Veja também o spam.',true)}catch(e){msg(ERR[e&&e.code]||'Não consegui mandar o e-mail.')}
  });
  AUTH.onAuthStateChanged(function(u){
    USER=u;
    if(u){$('auth').hidden=true;if(!started){started=true;startApp()}rq()}
    else{$('auth').hidden=false;ready.menu=ready.mesas=ready.estoque=false}
  });
  setMode('in');
}
(async function boot(){
  var cfg=window.APP_CONFIG&&window.APP_CONFIG.firebase;
  if(!window.firebase){V.fatal='sdk';render();return}
  if(!cfg||!cfg.apiKey||/COLE/i.test(cfg.apiKey)){V.fatal='config';render();return}
  try{
    firebase.initializeApp(cfg);
    AUTH=firebase.auth();
    var fs=firebase.firestore();
    try{await fs.enablePersistence({synchronizeTabs:true})}catch(e){}
    DB=fs;canWrite=true;
    wireAuth();
  }catch(e){V.fatal='erro';render()}
})();
})();
